<!DOCTYPE html>

<head>

<body class="contact-page">

    <header class="main-header">

        </a>
        <div class="hamburger"><span></span><span></span><span></span></div>
        <nav class="nav-menu">
            <a href="about.html" class="nav-link">
                <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/></svg></span>
                <span class="nav-txt">About</span>

            <a href="work.html" class="nav-link">
                <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg></span>

            </a>
            <a href="https://www.behance.net/stalinceapn" target="_blank" class="behance-link" title="Behance Profile">

                    <path d="M22 7h-7v-2h7v2zm1.726 10c-.442 1.297-2.029 3-5.101 3-3.074 0-5.564-1.729-5.564-5.675 0-3.91 2.325-5.92 5.466-5.92 3.082 0 4.964 1.782 5.375 4.426.078.506.109 1.188.095 2.14h-8.027c.13 3.211 3.483 3.312 4.588 2.029h3.168zm-7.686-4h4.965c-.105-1.547-1.136-2.219-2.477-2.219-1.466 0-2.277.768-2.488 2.219zm-9.574 6.988h-6.466v-15.144h6.616c2.298 0 5.409.811 5.409 4.461 0 2.815-2.248 3.678-3.694 3.903 1.487.191 4.159 1.507 4.159 4.161 0 3.176-3.375 2.619-6.024 2.619zm-3.466-8.453h2.677c1.768 0 2.813-.535 2.813-2.028 0-1.459-.974-1.871-2.656-1.871h-2.834v3.899zm0 5.641h3.047c2.473 0 3.125-.875 3.125-2.31 0-1.498-1.229-2.13-2.953-2.13h-3.219v4.44z" />

        </nav>
    </header>

    <main class="contact-main">
        <h1 class="sr-only">Contact Stalin Eapen</h1>
        <div class="contact-glow" aria-hidden="true"></div>

        <!-- floating doodles -->
        <span class="doodle d1" aria-hidden="true">✦</span>
        <span class="doodle d2" aria-hidden="true">✱</span>
        <span class="doodle d3" aria-hidden="true">◌</span>

        <div class="contact-grid">
            <div class="contact-left">
                <span class="contact-subtitle reveal">for a talk.</span>
                <div class="contact-big reveal">
                    need <span class="handwritten">Me?</span>
                </div>
                <p class="contact-note reveal">Got a project, a half-formed idea, or just want to say hi?
                    Drop a line — I read everything.</p>
            </div>

            <div class="contact-right reveal">
                <p class="form-instruction">Just write a mail</p>
                <a href="mailto:madebyeap@gmail.com" class="email-btn-pill">
                    <span class="email-btn-text">madebyeap@gmail.com</span>
                    <div class="submit-arrow-circle">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="5" x2="19" y2="19"></line>
                            <polyline points="19 9 19 19 9 19"></polyline>
                        </svg>
                    </div>
                </a>
                <div class="contact-socials">
                    <a href="https://www.behance.net/stalinceapn" target="_blank" class="chip"><span class="dot"></span>Behance</a>
                    <a href="../index.html" class="chip"><span class="dot"></span>Home</a>
                </div>
            </div>
        </div>

        <footer class="contact-foot reveal">
            <span class="footer-email">@madebyeap@gmail.com</span>
            <span class="footer-year">© 2026 — London</span>
        </footer>
    </main>

    <script src="../js/nav.js?v=3"></script>
    <script src="contact.js?v=3"></script>

</html>

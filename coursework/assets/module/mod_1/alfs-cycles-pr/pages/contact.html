<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Alf's Cycles - Get in touch with Keswick's trusted bike shop.">
    <title>Contact | Alf's Cycles</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Anybody+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,opsz,wght@25..151,14..72,100..900&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="../Assets/styles.css">
    <link rel="stylesheet" href="css/contact.css">
</head>
<body class="contact-page">
    
    <!-- Header & Navigation -->
    <header>
        <nav>
            <a href="../index.html" aria-label="Alf's Cycles Home">
                <img src="../Assets/Icons/logo.png" alt="Alf's Cycles Logo">
            </a>
            
            <ul>
                <li><a href="products.html">BIKES</a></li>
                <li><a href="story.html">STORY</a></li>
                <li><a href="repair.html">REPAIR</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
            
            <button aria-label="Toggle menu" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
            
            <a href="#account" aria-label="User Account">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </a>
        </nav>
    </header>

    <main>
        
        <!-- Contact Section -->
        <section>
            <article>
                <!-- Left Side: Contact Heading + Illustration -->
                <div class="contact-left">
                    <h1>CONTACT</h1>
                    <figure>
                        <img src="../Assets/Icons/alf_doingWheelie_1.png" alt="Cyclist illustration">
                    </figure>
                </div>
                
                <!-- Right Side: Contact Form -->
                <form class="contact-form">
                    <label>
                        <span>NAME</span>
                        <input type="text" name="name" required>
                    </label>
                    
                    <label>
                        <span>MESSAGE</span>
                        <textarea name="message" rows="1" required></textarea>
                    </label>
                    
                    <button type="submit">SEND</button>
                </form>
            </article>
            
            <!-- Bottom Section: Phone + Footer Nav -->
            <aside class="contact-bottom">
                <div class="phone">
                    <a href="tel:07352674664">07352 674664</a>
                </div>
                
                <nav>
                    <ul>
                        <li><a href="story.html">ABOUT</a></li>
                        <li><a href="products.html">PRODUCTS</a></li>
                        <li><a href="contact.html">CONTACT</a></li>
                    </ul>
                </nav>
            </aside>
        </section>
        
    </main>
    
    <!-- Copyright -->
    <footer>
        <small>&copy; 2026 Alf's Cycles | Family-Run Since 1987</small>
    </footer>
    
    <!-- JavaScript -->
    <script src="../Assets/scripts.js"></script>
    
</body>
</html>
